name: Voice
on:
  push: {paths: ['trigger/voice']} # write a date (YYYY-MM-DD) in this file to make that reel's voiceover
  workflow_dispatch:
concurrency: {group: reel-bot, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: chatterbox-v1}
      - run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
      - run: python tools/chatter_vo.py "queue/$(tr -d '[:space:]' < trigger/voice).json"
      - run: |
          git config user.name reel-bot && git config user.email reel-bot@users.noreply.github.com
          git add public/vo && git commit -m "voice $(cat trigger/voice)" && git pull --rebase --autostash && git push
