name: Auto replies
on:
  push: {paths: ['scripts/replies.mjs', 'data/dms.json', '.github/workflows/replies.yml']} # also run right after a change
  workflow_dispatch:
concurrency: {group: replies, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
      - run: node scripts/replies.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
