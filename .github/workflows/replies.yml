name: Auto replies
on:
  schedule:
    - cron: '*/15 * * * *' # GitHub may run it late or skip some; every 15 minutes keeps replies close to real time
  workflow_dispatch:
concurrency: {group: replies, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
      - run: node scripts/replies.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
