name: Ticker
# GitHub's own timer skips runs on this repo for hours, so this job checks every 10 minutes for ~5.5 hours, posts
# whatever is due (daily.mjs) and answers comment keywords (replies.mjs), then starts its own next run. The 6-hourly
# schedule only revives the chain if it ever breaks.
on:
  workflow_dispatch:
  push: {paths: ['trigger/tick']} # change this file to restart it by hand
  schedule:
    - cron: '23 */6 * * *'
concurrency: {group: ticker, cancel-in-progress: false}
permissions: {contents: write, actions: write}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install -q numpy scipy kokoro-onnx soundfile
      - name: Voice model (free, cached)
        uses: actions/cache@v4
        with: {path: models/kokoro, key: kokoro-v1.0}
      - run: |
          mkdir -p models/kokoro && cd models/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ $(stat -c%s $f 2>/dev/null || echo 0) -gt 1000000 ] || curl -fsSL --retry 3 -o $f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f; done
          ls -la
      - run: npm test
      - run: git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
      - name: Human voice model (free, cached)
        uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: chatterbox-v1}
      - run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts && echo "CHATTERBOX=1" >> $GITHUB_ENV
        continue-on-error: true # without it, reels use the standard voice
      - name: Check every 10 minutes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          end=$((SECONDS + 5 * 3600 + 1800))
          while [ $SECONDS -lt $end ]; do
            git pull -q --rebase --autostash || true
            node scripts/replies.mjs || true
            node scripts/daily.mjs || true
            sleep 600
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ticker.yml -R ${{ github.repository }}
