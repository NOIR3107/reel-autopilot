name: Daily reel
on:
  schedule:
    - cron: '7 13-23 * * *' # hourly; the script only posts once a day, at today's time slot
  push: {paths: ['trigger/post-now']} # change this file to post right away (GitHub's timer can lag)
  workflow_dispatch:
    inputs:
      force:
        description: Post now, ignoring the time slot
        type: boolean
        default: false
concurrency: {group: reel-bot, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install -q numpy scipy kokoro-onnx soundfile
      - name: Voice model (free, cached)
        uses: actions/cache@v4
        with: {path: models/kokoro, key: kokoro-v1.0}
      - run: |
          mkdir -p models/kokoro && cd models/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -s $f ] || curl -sSL -o $f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f; done
      - run: npm test
      - run: git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
      - name: DM people who commented WEBSITE
        run: node scripts/replies.mjs
        continue-on-error: true # a missing permission must never stop the daily post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - run: node scripts/daily.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE: ${{ (inputs.force || github.event_name == 'push') && '1' || '' }}
